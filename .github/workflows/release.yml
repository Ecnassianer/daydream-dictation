# Tags and releases the plugin when its version changes on main.
# Marketplace installs update when plugin.json's version changes; cloud
# environments that clone a release tag need the matching v<version> tag.
name: Release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .github/workflows/release.yml
      - tools/bump_version.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          # Fails if any version field disagrees with plugin.json.
          version=$(python3 tools/bump_version.py --check)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
